<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>SunWise Protect</title>
<style>
:root{--bg:#f4f7fb;--card:#ffffffcc;--tx:#0f172a;--mut:#64748b;--ac:#f59e0b;--bd:#e2e8f0;--bg2:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#1e293bcc;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155;--bg2:#111a2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);
padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:540px;margin:0 auto}
header{padding:22px 4px 6px;text-align:center}
h1{margin:0;font-size:28px}h1 span{color:var(--ac)}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #0001}
h2{font-size:14px;margin:0 0 12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skin{border:2px solid transparent;border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;cursor:pointer;
background:var(--bg);color:var(--tx);transition:.2s}
.skin i{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 6px;border:1px solid #0002}
.on{border-color:var(--ac)!important;transform:scale(1.04)}
.uv{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.uv b{font-size:46px}
.chip{padding:4px 12px;border-radius:99px;color:#fff;font-weight:600;font-size:13px;transition:background .2s}
input[type=range]{width:100%;height:12px;border-radius:8px;appearance:none;-webkit-appearance:none;outline:0;
background:linear-gradient(90deg,#22c55e,#eab308 35%,#f97316 60%,#ef4444 80%,#a855f7)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:32px;height:32px;border-radius:50%;
background:#fff;border:4px solid var(--ac);box-shadow:0 2px 8px #0005}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.gps{width:100%;margin-top:14px;height:48px;border-radius:14px;border:2px dashed var(--ac);background:transparent;
color:var(--tx);font-weight:700;font-size:15px}
.gps:disabled{opacity:.6}
#uvCard{display:none;margin-top:14px;padding:12px;border-radius:16px;background:var(--bg);border:1px solid var(--bd)}
#uvCard.show{display:block}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:14px}
.stats span{background:var(--card);border-radius:12px;padding:8px 10px}
#uvWhen{color:var(--mut);font-size:12px;margin-bottom:8px}
.spf{display:flex;gap:8px}
.spf button{flex:1;padding:12px 4px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:600}
.spf button.on{background:var(--ac);color:#000;border-color:var(--ac);transform:none}
.res{text-align:center}
.big{font-size:60px;font-weight:800;line-height:1}
.sub{color:var(--mut);font-size:14px}
.tags{margin-top:10px}
.tag{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font-weight:600;font-size:13px;margin:2px}
.btn{width:100%;padding:16px;border:0;border-radius:16px;background:var(--ac);color:#000;font-size:17px;font-weight:700;margin-top:14px}
#left{margin-top:10px;font-weight:700;font-variant-numeric:tabular-nums}
.warn{font-size:13px;color:var(--mut);margin-top:10px;text-align:center}
.bar{display:flex;gap:10px;justify-content:center;margin:6px 0}
.bar button{width:56px;height:48px;border-radius:14px;border:1px solid var(--bd);background:var(--card);font-size:22px;color:var(--tx)}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:14px}
.sheet{position:fixed;inset:0;background:#0009;display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .in{background:var(--bg2);color:var(--tx);width:100%;max-width:540px;max-height:82vh;overflow:auto;
border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}
.sheet h4{margin:0 0 12px;font-size:18px}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.langs button{height:64px;border-radius:16px;border:2px solid var(--bd);background:var(--bg);font-size:24px;color:var(--tx)}
.langs button small{display:block;font-size:11px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 5px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--ac)}
ol{padding-left:20px;line-height:1.55}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,30px);opacity:0;
padding:10px 20px;border-radius:99px;background:#fff;color:#111;font-size:14px;box-shadow:0 10px 30px #0005;
transition:.25s;z-index:50;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.warning{background:#fef3c7}#toast.error{background:#fee2e2}#toast.info{background:#dbeafe}
</style>
</head>
<body>
<main>
<header><h1>Sun<span>Wise</span> Protect</h1><div class="sub" id="sub"></div></header>

<section class="card"><h2 id="tSkin"></h2><div class="skins" id="skins"></div></section>

<section class="card"><h2 id="tUV"></h2>
 <div class="uv"><b id="uvv">6</b><span class="chip" id="uvc"></span></div>
 <input type="range" id="uv" min="1" max="11" value="6" aria-label="UV">
 <div class="scale"><span>1</span><span>3</span><span>6</span><span>8</span><span>11</span></div>
 <button class="gps" id="bGeo"></button>
 <div id="uvCard"><div id="uvWhen"></div><div class="stats" id="uvStats"></div></div>
</section>

<section class="card"><h2 id="tSPF"></h2><div class="spf" id="spf"></div></section>

<section class="card res">
 <h2 id="tRes"></h2>
 <div class="big" id="time">--</div><div class="sub" id="unit"></div>
 <div class="tags" id="tags"></div>
 <button class="btn" id="go"></button>
 <div id="left"></div>
<div class="warn" id="avviso"></div>
</section>

<div class="bar">
 <button id="nLang" aria-label="Language">🌍</button>
 <button id="nInfo" aria-label="Info">ℹ️</button>
 <button id="nFitz" aria-label="Fitzpatrick">❓</button>
</div>
<footer>Concept &amp; Code by Enzo Notari</footer>
</main>

<div class="sheet" id="sLang"><div class="in"><h4>🌍</h4><div class="langs" id="langs"></div></div></div>
<div class="sheet" id="sInfo"><div class="in"><h4 id="iTitle"></h4><ol id="iText"></ol></div></div>
<div class="sheet" id="sFitz"><div class="in"><h4 id="fTitle"></h4><table id="fTable"></table></div></div>
<div id="toast"></div>

 min:"минут",sug:"Рекомендуется",geoErr:"Не удалось определить местоположение.",noGeo:"Ваше устройство не поддерживает геолокацию.",

};
const FL={it:"🇮🇹",en:"🇬🇧",de:"🇩🇪",fr:"🇫🇷",es:"🇪🇸",ru:"🇷🇺"};
const SKIN=["#f5e5d5","#e0c6a7","#c9a87c","#a9835a","#7e5a3c","#4e3a29"];
const ROM=["I","II","III","IV","V","VI"];
const BASE=[10,20,30,45,60,90];
const UVC=["#22c55e","#4ade80","#a3e635","#eab308","#f59e0b","#f97316","#fb5b21","#ef4444","#dc2626","#b91c1c","#a855f7"];
const SPFS=[0,15,30,50];
const $=i=>document.getElementById(i);
const detect=()=>{const l=(navigator.language||"it").slice(0,2).toLowerCase();return T[l]?l:"en"};
const uvColor=u=>UVC[Math.max(0,Math.min(10,Math.round(u)-1))];
const lvIdx=u=>u<3?0:u<6?1:u<8?2:u<11?3:4;
let L=T[localStorage.lang]?localStorage.lang:detect(), skin=+localStorage.skin||0, uv=+localStorage.uv||6, spf=+localStorage.spf||0, tm=null, mins=0, uvData=null;

function toast(m,t="info"){const e=$("toast");e.textContent=m;e.className="show "+t;clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",3500)}
function calc(){const b=BASE[skin-1]*5/uv;return spf?b*(1+spf*0.1):b}

function renderUVCard(){
 const c=$("uvCard");
 if(!uvData){c.classList.remove("show");return}
 const t=T[L],d=uvData;
 $("uvWhen").textContent=`${t.at} ${d.time} · UV ${d.now.toFixed(1)}`;
 $("uvStats").innerHTML=`<span>☀️ ${t.max}: <b>${d.max.toFixed(1)}</b></span><span>🌤️ ${t.clear}: <b>${d.clear.toFixed(1)}</b></span>`+
  `<span>☁️ ${t.cloud}: <b>${Math.round(d.cloud)}%</b></span><span>🌡️ ${t.temp}: <b>${Math.round(d.temp)}°C</b></span>`;
 c.classList.add("show");
}
function result(){
 const t=T[L];
 if(!skin){$("time").textContent="--";$("unit").textContent=t.selSkin;$("tags").innerHTML="";return}
 mins=calc();const m=Math.round(mins);
 $("time").textContent=m>=120?Math.floor(m/60)+"h "+(m%60):m;
 $("time").style.color=m>=40?"#22c55e":m>=20?"#eab308":"#ef4444";
 $("unit").textContent=m>=120?"":t.min;
 const rec=skin<=2&&uv>=6?"SPF 50+":skin<=4&&uv>=3?"SPF 30+":"SPF 15+";
 $("tags").innerHTML=`<span class="tag">🧴 ${t.sug}: ${rec}</span>`+(spf?`<span class="tag">SPF ${spf}</span>`:"");
}
function render(){
 const t=T[L];document.documentElement.lang=L;
 $("sub").textContent=t.sub;$("tSkin").textContent=t.skin;$("tUV").textContent=t.uv;$("tSPF").textContent=t.spf;$("tRes").textContent=t.res;
 $("avviso").textContent=t.warn;$("iTitle").textContent=t.iT;$("fTitle").textContent=t.fT;$("bGeo").textContent=t.gps;
 $("iText").innerHTML=t.i.map(x=>`<li>${x}</li>`).join("");
 $("fTable").innerHTML=`<tr>${t.fH.map(h=>`<th>${h}</th>`).join("")}</tr>`+t.f.map((r,i)=>`<tr><td><b>${ROM[i]}</b></td><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
 $("skins").innerHTML=SKIN.map((c,i)=>`<button class="skin ${skin==i+1?"on":""}" onclick="setSkin(${i+1})"><i style="background:${c}"></i><b>${ROM[i]}</b></button>`).join("");
 $("spf").innerHTML=SPFS.map(p=>`<button class="${spf==p?"on":""}" onclick="setSPF(${p})">${p?p:t.none}</button>`).join("");
 $("langs").innerHTML=Object.keys(T).map(l=>`<button onclick="setLang('${l}')">${FL[l]}<small>${T[l].n}</small></button>`).join("");
 $("uv").value=uv;$("uvv").textContent=uv;$("uvc").textContent=t.lv[lvIdx(uv)];$("uvc").style.background=uvColor(uv);
 if(!tm)$("go").textContent=t.start;else $("go").textContent=t.stop;
 renderUVCard();result();
}
function setSkin(n){skin=n;localStorage.skin=n;stopT();render()}
function setSPF(p){spf=p;localStorage.spf=p;stopT();render()}
function setLang(l){L=l;localStorage.lang=l;close_();render()}
function close_(){document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("show"))}
$("uv").oninput=e=>{uv=+e.target.value;localStorage.uv=uv;stopT();render()};

function stopT(){clearInterval(tm);tm=null;$("left").textContent="";$("go").textContent=T[L].start}
$("go").onclick=()=>{
 if(!skin)return toast(T[L].selSkin,"warning");
 if(tm)return stopT();
 const end=Date.now()+mins*60000;$("go").textContent=T[L].stop;
 tm=setInterval(()=>{const r=end-Date.now();
  if(r<=0){stopT();$("left").textContent=T[L].done;toast(T[L].done,"error");
   navigator.vibrate&&navigator.vibrate([500,200,500,200,500]);return}
  const s=Math.floor(r/1000);$("left").textContent=`${T[L].left} ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`},500)};

function geo(){
 const t=T[L],b=$("bGeo");
 if(!("geolocation" in navigator))return toast(t.noGeo,"error");
 b.disabled=true;b.textContent=t.locating;
 navigator.geolocation.getCurrentPosition(p=>fetchUV(p.coords.latitude,p.coords.longitude),
  ()=>{b.disabled=false;b.textContent=T[L].gps;toast(T[L].geoErr,"error")},
  {timeout:20000,maximumAge:300000});
}
async function fetchUV(lat,lon){
 try{
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
   `&current=uv_index,uv_index_clear_sky,cloud_cover,temperature_2m&daily=uv_index_max&timezone=auto&forecast_days=1`;
  const r=await fetch(url);if(!r.ok)throw 0;
  const d=await r.json(),c=d.current;
  uvData={now:c.uv_index,clear:c.uv_index_clear_sky,cloud:c.cloud_cover,temp:c.temperature_2m,max:d.daily.uv_index_max[0],time:c.time.slice(11,16)};
  uv=Math.max(1,Math.min(11,Math.round(c.uv_index)));localStorage.uv=uv;
  stopT();toast(T[L].uvNow.replace("{uv}",c.uv_index.toFixed(1)));
 }catch(e){toast(T[L].uvErr,"error")}
 $("bGeo").disabled=false;render();
}
$("bGeo").onclick=geo;

$("nLang").onclick=()=>$("sLang").classList.add("show");
$("nInfo").onclick=()=>$("sInfo").classList.add("show");
$("nFitz").onclick=()=>$("sFitz").classList.add("show");
document.querySelectorAll(".sheet").forEach(s=>s.onclick=e=>{if(e.target===s)close_()});
render();
</script>
</body></html>
