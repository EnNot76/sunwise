<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8a00">
<title>SunWise Protect</title>
<style>
:root{--bg1:#ffe7b8;--bg2:#fff6e3;--card:#ffffffd9;--tx:#2d1600;--mut:#7a5c46;--ac:#ff8a00;--bd:#f1d5a6;--chip:#fff3dc}
@media(prefers-color-scheme:dark){:root{--bg1:#2a1700;--bg2:#0f0a05;--card:#241a10d9;--tx:#fdf1e3;--mut:#c7a98c;--bd:#4a3520;--chip:#33241459}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Roboto,sans-serif;color:var(--tx);
background:radial-gradient(circle at top,var(--bg1),var(--bg2) 70%) fixed;
padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 92px)}
main{max-width:540px;margin:0 auto}
h1{text-align:center;font-size:30px;margin:14px 0 2px;background:linear-gradient(90deg,#ff8a00,#ffc400);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:in .8s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-14px) scale(.92)}to{opacity:1;transform:none}}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:24px;
padding:16px;margin:14px 0;box-shadow:0 14px 34px #8d491226}
h3{margin:0 0 10px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skin{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:16px;
border:2px solid var(--bd);background:var(--chip);color:var(--tx);font-weight:700;font-size:15px;transition:.15s}
.skin i{width:22px;height:22px;border-radius:50%;box-shadow:0 3px 6px #0004;border:1px solid #0003}
.on{border-color:var(--ac)!important;box-shadow:0 0 0 3px #ff8a0044;transform:scale(1.03)}
.uvgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.uvb{height:46px;border-radius:14px;border:2px solid transparent;font-weight:800;font-size:16px;color:#fff;
text-shadow:0 1px 2px #0006;transition:.15s}
.geo{grid-column:span 6;height:52px;border-radius:16px;border:0;background:linear-gradient(135deg,#ff8a00,#ffc400);
color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 18px #ff8a0055}
.geo:disabled{opacity:.6}
#uvCard{display:none;margin-top:14px;padding:14px;border-radius:18px;background:var(--chip);border:1px solid var(--bd)}
#uvCard.show{display:block;animation:in .4s}
.uvTop{display:flex;align-items:center;gap:14px}
.uvBig{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:800;
text-shadow:0 1px 3px #0006;flex:none}
.uvTxt b{font-size:18px}.uvTxt div{color:var(--mut);font-size:13px}
.uvStats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px;font-size:14px}
.uvStats span{background:var(--card);border-radius:12px;padding:8px 10px}
.spf{display:flex;gap:8px}
.spf button{flex:1;height:44px;border-radius:14px;border:2px solid var(--bd);background:var(--chip);color:var(--tx);font-weight:700}
.actions{display:flex;gap:12px}
.act{flex:1;height:54px;border:0;border-radius:99px;color:#fff;font-size:18px;font-weight:700;box-shadow:0 10px 20px #a0500040;transition:.1s}
.act:active{transform:scale(.96)}
.calc{background:linear-gradient(135deg,#34c759,#7be495)}
.reset{background:linear-gradient(135deg,#ff4b3a,#ff8a80);flex:.45}
.res{display:none;text-align:center}.res.show{display:block;animation:in .4s}
.ring{--p:0;--c:#34c759;width:150px;height:150px;border-radius:50%;margin:4px auto 10px;display:grid;place-items:center;
background:conic-gradient(var(--c) calc(var(--p)*1%),#8883 0)}
.ring div{width:122px;height:122px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;align-content:center}
.ring b{font-size:42px;line-height:1}.ring span{font-size:13px;color:var(--mut)}
.tag{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--chip);border:1px solid var(--bd);font-weight:700;margin:2px}
.timer{width:100%;height:50px;border:0;border-radius:16px;margin-top:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:700}
#left{margin-top:8px;font-weight:700;font-variant-numeric:tabular-nums}
.warn{text-align:center;color:var(--mut);font-size:14px}
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:516px;margin:auto;
display:flex;justify-content:space-around;background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--bd);
border-radius:99px;padding:6px;box-shadow:0 12px 30px #0003}
nav button{flex:1;height:48px;border:0;background:none;font-size:22px;border-radius:99px;color:var(--tx)}
nav button:active{background:var(--chip)}
.sheet{position:fixed;inset:0;background:#28140088;display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .in{background:var(--bg2);color:var(--tx);width:100%;max-width:540px;max-height:82vh;overflow:auto;
border-radius:28px 28px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet h4{margin:0 0 12px;font-size:18px}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.langs button{height:64px;border-radius:16px;border:2px solid var(--bd);background:var(--chip);font-size:24px;color:var(--tx)}
.langs button small{display:block;font-size:11px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 5px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--ac)}
ol{padding-left:20px;line-height:1.55}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translate(-50%,30px);opacity:0;
padding:10px 20px;border-radius:99px;background:#fff;color:#111;font-size:14px;box-shadow:0 10px 30px #0005;
transition:.25s;z-index:50;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.warning{background:#fef3c7}#toast.error{background:#fee2e2}#toast.info{background:#dbeafe}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>

<section class="card"><h3 id="tSkin"></h3><div class="skins" id="skins"></div></section>

<section class="card"><h3 id="tUV"></h3>
 <button class="geo" id="bGeo"></button>
 <div id="uvCard">
  <div class="uvTop"><div class="uvBig" id="uvBig"></div>
   <div class="uvTxt"><b id="uvLvl"></b><div id="uvWhen"></div></div></div>
  <div class="uvStats" id="uvStats"></div>
 </div>
 <div class="uvgrid" id="uvs" style="margin-top:14px"></div>
</section>

<section class="card"><h3 id="tSPF"></h3><div class="spf" id="spf"></div></section>

<div class="actions">
 <button class="act calc" id="bCalc" aria-label="Calcola">⏱️</button>
 <button class="act reset" id="bReset" aria-label="Reset">🔄</button>
</div>

<section class="card res" id="res">
 <div class="ring" id="ring"><div><b id="mins">0</b><span id="unit"></span></div></div>
 <div id="tags"></div>
 <button class="timer" id="bTimer"></button>
 <div id="left"></div>
</section>
<p class="warn" id="avviso"></p>
</main>

<nav>
 <button id="nLang" aria-label="Language">🌍</button>
 <button id="nInfo" aria-label="Info">ℹ️</button>
 <button id="nFitz" aria-label="Fitzpatrick">❓</button>
</nav>

<div class="sheet" id="sLang"><div class="in"><h4>🌍 Language</h4><div class="langs" id="langs"></div></div></div>
<div class="sheet" id="sInfo"><div class="in"><h4 id="iTitle"></h4><ol id="iText"></ol>
 <div class="foot">☀️ Concept &amp; Code by Enzo Notari</div></div></div>
<div class="sheet" id="sFitz"><div class="in"><h4 id="fTitle"></h4><table id="fTable"></table></div></div>
<div id="toast"></div>

 $("iText").innerHTML=t.i.map(x=>`<li>${x}</li>`).join("");
 $("fTable").innerHTML=`<tr>${t.fH.map(h=>`<th>${h}</th>`).join("")}</tr>`+t.f.map((r,i)=>`<tr><td><b>${i+1}</b></td><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
 $("skins").innerHTML=SKIN.map((c,i)=>`<button class="skin ${skin==i+1?"on":""}" onclick="setSkin(${i+1})"><i style="background:${c}"></i>${i+1}</button>`).join("");
 $("uvs").innerHTML=UVC.map((c,i)=>`<button class="uvb ${uv==i+1?"on":""}" style="background:${c}" onclick="setUV(${i+1})">${i+1}</button>`).join("");
 $("spf").innerHTML=SPFS.map(p=>`<button class="${spf==p?"on":""}" onclick="setSPF(${p})">${p?p:t.none}</button>`).join("");
 $("langs").innerHTML=Object.keys(T).map(l=>`<button class="${L==l?"on":""}" onclick="setLang('${l}')">${FL[l]}<small>${T[l].n}</small></button>`).join("");
 $("bTimer").textContent=tm?t.stop:t.start;$("unit").textContent=t.min;
 renderUVCard();
 if($("res").classList.contains("show"))show();
}
function setSkin(n){skin=n;localStorage.skin=n;render()}
function setUV(n){uv=n;render()}
function setSPF(p){spf=p;localStorage.spf=p;render()}
function setLang(l){L=l;localStorage.lang=l;close_();render()}
function close_(){document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("show"))}

function show(){
 const t=T[L];mins=calc();const m=Math.round(mins);
 $("mins").textContent=m;
 const c=m>=40?"#34c759":m>=20?"#ffcc00":"#ff3b30";
 $("ring").style.setProperty("--c",c);$("ring").style.setProperty("--p",Math.min(100,m/90*100));
 const rec=skin<=2&&uv>=6?"SPF 50+":skin<=4&&uv>=3?"SPF 30+":"SPF 15+";
 $("tags").innerHTML=`<span class="tag">🧴 ${t.sug}: ${rec}</span><span class="tag">☀️ UV ${uv}</span>`+(spf?`<span class="tag">SPF ${spf}</span>`:"");
 $("res").classList.add("show");
}
$("bCalc").onclick=()=>{const t=T[L];
 if(!skin)return toast(t.selSkin,"warning");
 if(!uv)return toast(t.selUV,"warning");
 stopT();show();$("res").scrollIntoView({behavior:"smooth",block:"center"})};
$("bReset").onclick=()=>{skin=0;uv=0;spf=0;uvData=null;localStorage.removeItem("skin");localStorage.removeItem("spf");
 stopT();$("res").classList.remove("show");render()};

function stopT(){clearInterval(tm);tm=null;$("left").textContent="";$("bTimer").textContent=T[L].start}
$("bTimer").onclick=()=>{
 if(tm)return stopT();
 const end=Date.now()+mins*60000;$("bTimer").textContent=T[L].stop;
 tm=setInterval(()=>{const r=end-Date.now();
  if(r<=0){stopT();$("left").textContent=T[L].done;toast(T[L].done,"error");
   navigator.vibrate&&navigator.vibrate([500,200,500,200,500]);return}
  const s=Math.floor(r/1000);$("left").textContent=`${T[L].left} ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`},500)};

function geo(){
 const t=T[L];
 if(!("geolocation" in navigator))return toast(t.noGeo,"error");
 const b=$("bGeo");b.disabled=true;b.textContent=t.locating;
 navigator.geolocation.getCurrentPosition(
  p=>fetchUV(p.coords.latitude,p.coords.longitude),
  ()=>{b.disabled=false;b.textContent=T[L].gps;toast(T[L].geoErr,"error")},
  {enableHighAccuracy:false,timeout:20000,maximumAge:300000});
}
async function fetchUV(lat,lon){
 const b=$("bGeo");
 try{
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
   `&current=uv_index,uv_index_clear_sky,cloud_cover,temperature_2m&daily=uv_index_max&timezone=auto&forecast_days=1`;
  const r=await fetch(url);if(!r.ok)throw 0;
  const d=await r.json(),c=d.current;
  uvData={now:c.uv_index,clear:c.uv_index_clear_sky,cloud:c.cloud_cover,temp:c.temperature_2m,
   max:d.daily.uv_index_max[0],time:c.time.slice(11,16)};
  uv=Math.max(1,Math.min(11,Math.round(c.uv_index)));
  render();toast(T[L].uvNow.replace("{uv}",c.uv_index.toFixed(1)));
 }catch(e){toast(T[L].uvErr,"error")}
 b.disabled=false;b.textContent=T[L].gps;
}
$("bGeo").onclick=geo;

$("nLang").onclick=()=>$("sLang").classList.add("show");
$("nInfo").onclick=()=>$("sInfo").classList.add("show");
$("nFitz").onclick=()=>$("sFitz").classList.add("show");
document.querySelectorAll(".sheet").forEach(s=>s.onclick=e=>{if(e.target===s)close_()});
render();
</script>
</body></html>
